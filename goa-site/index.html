  <!-- ═══ INLINE CRITICAL CSS — prevents flash of unstyled content ═══ -->
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body,#root{width:100%;min-height:100vh;background:#FBF7F0;color:#2A1F0E}
    body{font-family:'Noto Sans Hebrew','Cormorant Garamond',Georgia,serif}
    /* Prevent layout shift while fonts load */
    #root:empty::before{
      content:'';display:block;height:100vh;
      background:linear-gradient(180deg,#FBF7F0 0%,#F2EAD8 100%);
    }
    /* Reduce motion */
    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{
        animation-duration:0.01ms!important;
        animation-iteration-count:1!important;
        transition-duration:0.01ms!important;
      }
    }
  </style>
